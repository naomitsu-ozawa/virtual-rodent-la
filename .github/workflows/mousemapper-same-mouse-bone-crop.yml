name: MouseMapper same-mouse bone crop

on:
  push:
    paths:
      - '.github/workflows/mousemapper-same-mouse-bone-crop.yml'
  workflow_dispatch:

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download official model and same-mouse inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mm/model /tmp/mm/raw /tmp/mm/crops /tmp/mm/out /tmp/nnUNet_results
          curl -L --retry 4 --fail "https://media.githubusercontent.com/media/erturklab/mouseMapper/7fe04a9ccf37664d76fe548ae226147c0023ceb7/models/Tissue_model.zip" -o /tmp/Tissue_model.zip
          python - <<'PY'
          import zipfile, os, shutil
          z=zipfile.ZipFile('/tmp/Tissue_model.zip')
          prefix='exported_models_310 (1)/Dataset310_AllSeg/nnUNetTrainer__nnUNetPlans__3d_fullres/'
          out='/tmp/nnUNet_results/Dataset310_AllSeg/nnUNetTrainer__nnUNetPlans__3d_fullres'
          os.makedirs(out+'/fold_0',exist_ok=True)
          for rel in ['plans.json','dataset.json','dataset_fingerprint.json','fold_0/checkpoint_final.pth']:
              dst=os.path.join(out,rel); os.makedirs(os.path.dirname(dst),exist_ok=True)
              with z.open(prefix+rel) as r, open(dst,'wb') as w: shutil.copyfileobj(r,w)
          PY
          base="https://raw.githubusercontent.com/erturklab/mouseMapper/7fe04a9ccf37664d76fe548ae226147c0023ceb7/Tissue_Module/example_data/organ_segmentation_sample"
          curl -L --retry 4 --fail "$base/segmentation/CD68_chow_7790.nii.gz" -o /tmp/mm/raw/organs.nii.gz
          curl -L --retry 4 --fail "$base/pipeline_test/CD68_chow_7790_fused_whole_arivis_exportC01xy10z10_0000.nii.gz" -o /tmp/mm/raw/af.nii.gz
          curl -L --retry 4 --fail "$base/pipeline_test/CD68_chow_7790_fused_whole_arivis_exportC01xy10z10_0001.nii.gz" -o /tmp/mm/raw/pi.nii.gz
          train="https://raw.githubusercontent.com/erturklab/mouseMapper/7fe04a9ccf37664d76fe548ae226147c0023ceb7/Tissue_Module/example_data/images"
          curl -L --retry 4 --fail "$train/2000i9j1crop_210_0000.nii.gz" -o /tmp/mm/raw/train_af.nii.gz
          curl -L --retry 4 --fail "$train/2000i9j1crop_210_0001.nii.gz" -o /tmp/mm/raw/train_pi.nii.gz

      - name: Install inference dependencies
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet nnunetv2 nibabel matplotlib

      - name: Build normalized same-mouse crops
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          import nibabel as nib
          import numpy as np
          org_img=nib.load('/tmp/mm/raw/organs.nii.gz'); org=np.asanyarray(org_img.dataobj)
          af=np.asanyarray(nib.load('/tmp/mm/raw/af.nii.gz').dataobj).astype(np.float32)
          pi=np.asanyarray(nib.load('/tmp/mm/raw/pi.nii.gz').dataobj).astype(np.float32)
          taf=np.asanyarray(nib.load('/tmp/mm/raw/train_af.nii.gz').dataobj)
          tpi=np.asanyarray(nib.load('/tmp/mm/raw/train_pi.nii.gz').dataobj)
          print('TRAIN_AF',taf.dtype,taf.shape,float(taf.min()),float(taf.max()),np.quantile(taf,[.01,.5,.99]).tolist())
          print('TRAIN_PI',tpi.dtype,tpi.shape,float(tpi.min()),float(tpi.max()),np.quantile(tpi,[.01,.5,.99]).tolist())
          print('RAW_AF',af.dtype,af.shape,float(af.min()),float(af.max()),np.quantile(af,[.01,.5,.99]).tolist())
          print('RAW_PI',pi.dtype,pi.shape,float(pi.min()),float(pi.max()),np.quantile(pi,[.01,.5,.99]).tolist())

          # Training samples are normalized to approximately 0..1; public same-animal
          # downsampled channels are uint8. Match the model input intensity scale exactly.
          af/=255.0; pi/=255.0

          def center_for(labels):
              mask=np.isin(org,labels)
              pts=np.argwhere(mask)
              return np.rint(pts.mean(axis=0)).astype(int) if len(pts) else np.array(org.shape)//2

          cases={
            'head':center_for([5,23,24,25,26,27]),
            'thorax':center_for([3,4,9,14]),
          }
          crop_size=np.array([256,256,256])
          manifest={}
          for name,c in cases.items():
              start=np.maximum(0,c-crop_size//2)
              start=np.minimum(start,np.array(org.shape)-crop_size)
              end=start+crop_size
              sl=tuple(slice(int(a),int(b)) for a,b in zip(start,end))
              outdir=f'/tmp/mm/crops/{name}';os.makedirs(outdir,exist_ok=True)
              aff=np.eye(4)
              nib.save(nib.Nifti1Image(af[sl].astype(np.float32),aff),f'{outdir}/{name}_0000.nii.gz')
              nib.save(nib.Nifti1Image(pi[sl].astype(np.float32),aff),f'{outdir}/{name}_0001.nii.gz')
              nib.save(nib.Nifti1Image(org[sl].astype(np.uint8),aff),f'{outdir}/{name}_organs.nii.gz')
              manifest[name]={'center':c.tolist(),'start':start.tolist(),'end':end.tolist()}
          open('/tmp/mm/crop_manifest.json','w').write(json.dumps(manifest,indent=2))
          print('CROPS',json.dumps(manifest))
          PY

      - name: Add MouseMapper trainer compatibility alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import nnunetv2.training.nnUNetTrainer as pkg
          p=Path(pkg.__file__).parent/'nnUNetTrainerv2.py'
          p.write_text("from nnunetv2.training.nnUNetTrainer.nnUNetTrainer import nnUNetTrainer\nclass nnUNetTrainerv2(nnUNetTrainer):\n    pass\n")
          PY

      - name: Infer head crop
        shell: bash
        env:
          nnUNet_results: /tmp/nnUNet_results
          nnUNet_raw: /tmp/nnUNet_raw
          nnUNet_preprocessed: /tmp/nnUNet_preprocessed
        run: |
          mkdir -p /tmp/mm/out/head
          nnUNetv2_predict -i /tmp/mm/crops/head -o /tmp/mm/out/head -d 310 -c 3d_fullres -tr nnUNetTrainer -f 0 -chk checkpoint_final.pth -device cpu --disable_tta

      - name: Infer thorax crop
        shell: bash
        env:
          nnUNet_results: /tmp/nnUNet_results
          nnUNet_raw: /tmp/nnUNet_raw
          nnUNet_preprocessed: /tmp/nnUNet_preprocessed
        run: |
          mkdir -p /tmp/mm/out/thorax
          nnUNetv2_predict -i /tmp/mm/crops/thorax -o /tmp/mm/out/thorax -d 310 -c 3d_fullres -tr nnUNetTrainer -f 0 -chk checkpoint_final.pth -device cpu --disable_tta

      - name: Analyze bone and marrow predictions
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          import nibabel as nib
          import numpy as np
          import matplotlib.pyplot as plt
          result={}
          for name in ['head','thorax']:
              pred=np.asanyarray(nib.load(f'/tmp/mm/out/{name}/{name}.nii.gz').dataobj).astype(np.uint8)
              org=np.asanyarray(nib.load(f'/tmp/mm/crops/{name}/{name}_organs.nii.gz').dataobj).astype(np.uint8)
              vals,counts=np.unique(pred,return_counts=True)
              d={'labels':{str(int(v)):int(c) for v,c in zip(vals,counts)}}
              bone=pred==3; marrow=pred==4
              d['bone_voxels']=int(bone.sum());d['marrow_voxels']=int(marrow.sum())
              # Sanity metrics: bone should be spatially distributed around organ mass, not random fragments.
              coords=np.argwhere(bone)
              if len(coords):
                  d['bone_bbox_min']=coords.min(axis=0).tolist();d['bone_bbox_max']=coords.max(axis=0).tolist()
              result[name]=d
              proj=bone.max(axis=2).astype(float)+0.5*marrow.max(axis=2).astype(float)
              plt.figure(figsize=(7,7));plt.imshow(proj.T,origin='lower',cmap='gray');plt.title(f'{name}: bone=white, marrow=gray');plt.axis('off');plt.tight_layout();plt.savefig(f'/tmp/mm/{name}_bone_preview.png',dpi=160);plt.close()
          print('SAME_MOUSE_BONE_CROP='+json.dumps(result,sort_keys=True))
          open('/tmp/mm/same_mouse_crop_result.json','w').write(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload crop results
        uses: actions/upload-artifact@v4
        with:
          name: mousemapper-same-mouse-bone-crop
          path: |
            /tmp/mm/same_mouse_crop_result.json
            /tmp/mm/crop_manifest.json
            /tmp/mm/head_bone_preview.png
            /tmp/mm/thorax_bone_preview.png
            /tmp/mm/out/head/head.nii.gz
            /tmp/mm/out/thorax/thorax.nii.gz
