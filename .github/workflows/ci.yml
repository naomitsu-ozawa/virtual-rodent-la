name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_demo:
        description: 'Also run the public demo E2E test (downloads ~20.8 MB from Zenodo; always runs on PRs)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Static checks + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (undefined references, duplicate declarations)
        run: npm run lint
      - run: npm test

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npx playwright test tests/e2e/smoke.spec.js tests/e2e/folder-project.spec.js tests/e2e/project-share.spec.js tests/e2e/mpr3d-sliders.spec.js
      - name: Public demo end-to-end (Zenodo download)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_demo)
        run: npx playwright test tests/e2e/demo.spec.js
        env:
          RUN_DEMO_E2E: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
