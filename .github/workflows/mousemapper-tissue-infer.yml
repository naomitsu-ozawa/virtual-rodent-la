name: MouseMapper tissue inference

on:
  push:
    paths:
      - '.github/workflows/mousemapper-tissue-infer.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download official MouseMapper tissue model and example
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mm/input /tmp/mm/output /tmp/nnUNet_results
          model_url="https://media.githubusercontent.com/media/erturklab/mouseMapper/7fe04a9ccf37664d76fe548ae226147c0023ceb7/models/Tissue_model.zip"
          curl -L --retry 4 --fail "$model_url" -o /tmp/Tissue_model.zip
          python - <<'PY'
          import zipfile, os, shutil
          z=zipfile.ZipFile('/tmp/Tissue_model.zip')
          prefix='exported_models_310 (1)/Dataset310_AllSeg/nnUNetTrainer__nnUNetPlans__3d_fullres/'
          out='/tmp/nnUNet_results/Dataset310_AllSeg/nnUNetTrainer__nnUNetPlans__3d_fullres'
          os.makedirs(out+'/fold_0',exist_ok=True)
          for rel in ['plans.json','dataset.json','dataset_fingerprint.json','fold_0/checkpoint_final.pth']:
              src=prefix+rel
              dst=os.path.join(out,rel)
              os.makedirs(os.path.dirname(dst),exist_ok=True)
              with z.open(src) as r, open(dst,'wb') as w:
                  shutil.copyfileobj(r,w)
          PY
          base="https://raw.githubusercontent.com/erturklab/mouseMapper/7fe04a9ccf37664d76fe548ae226147c0023ceb7/Tissue_Module/example_data"
          curl -L --retry 4 --fail "$base/images/2000i9j1crop_210_0000.nii.gz" -o /tmp/mm/input/case_0000.nii.gz
          curl -L --retry 4 --fail "$base/images/2000i9j1crop_210_0001.nii.gz" -o /tmp/mm/input/case_0001.nii.gz
          curl -L --retry 4 --fail "$base/label/2000i9j1crop_210.nii.gz" -o /tmp/mm/reference.nii.gz

      - name: Install nnUNetv2
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet nnunetv2 nibabel

      - name: Run official Tissue Module fold 0 on example
        shell: bash
        env:
          nnUNet_results: /tmp/nnUNet_results
          nnUNet_raw: /tmp/nnUNet_raw
          nnUNet_preprocessed: /tmp/nnUNet_preprocessed
        run: |
          set -euxo pipefail
          /usr/bin/time -v nnUNetv2_predict \
            -i /tmp/mm/input \
            -o /tmp/mm/output \
            -d 310 \
            -c 3d_fullres \
            -tr nnUNetTrainer \
            -f 0 \
            -chk checkpoint_final.pth \
            -device cpu \
            --disable_tta
          python - <<'PY'
          import json, nibabel as nib, numpy as np, os
          ref=np.asanyarray(nib.load('/tmp/mm/reference.nii.gz').dataobj).astype(np.uint8)
          pred_path='/tmp/mm/output/case.nii.gz'
          pred=np.asanyarray(nib.load(pred_path).dataobj).astype(np.uint8)
          out={'ref_labels':{},'pred_labels':{},'dice':{}}
          for arr,key in [(ref,'ref_labels'),(pred,'pred_labels')]:
              vals,counts=np.unique(arr,return_counts=True)
              out[key]={str(int(v)):int(c) for v,c in zip(vals,counts)}
          for label in sorted(set(np.unique(ref)).union(np.unique(pred))):
              if label==0: continue
              a=ref==label;b=pred==label
              den=int(a.sum()+b.sum())
              out['dice'][str(int(label))]=float(2*np.logical_and(a,b).sum()/den) if den else None
          print('TISSUE_BENCHMARK='+json.dumps(out,sort_keys=True))
          open('/tmp/mm/benchmark.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: mousemapper-tissue-benchmark
          path: |
            /tmp/mm/benchmark.json
            /tmp/mm/output/case.nii.gz
