name: MouseMapper full same-mouse tissue map

on:
  push:
    paths:
      - '.github/workflows/mousemapper-full-tissue-map.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  MOUSEMAPPER_REF: 7fe04a9ccf37664d76fe548ae226147c0023ceb7

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download official fold 0 and same-mouse inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/model/Dataset310_AllSeg/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_0 /tmp/raw
          curl -L --retry 4 --fail "https://media.githubusercontent.com/media/erturklab/mouseMapper/7fe04a9ccf37664d76fe548ae226147c0023ceb7/models/Tissue_model.zip" -o /tmp/Tissue_model.zip
          python - <<'PY'
          import zipfile, os, shutil
          z=zipfile.ZipFile('/tmp/Tissue_model.zip')
          prefix='exported_models_310 (1)/Dataset310_AllSeg/nnUNetTrainer__nnUNetPlans__3d_fullres/'
          out='/tmp/model/Dataset310_AllSeg/nnUNetTrainer__nnUNetPlans__3d_fullres'
          for rel in ['plans.json','dataset.json','dataset_fingerprint.json','fold_0/checkpoint_final.pth']:
              dst=os.path.join(out,rel); os.makedirs(os.path.dirname(dst),exist_ok=True)
              with z.open(prefix+rel) as r, open(dst,'wb') as w: shutil.copyfileobj(r,w)
          PY
          base="https://raw.githubusercontent.com/erturklab/mouseMapper/7fe04a9ccf37664d76fe548ae226147c0023ceb7/Tissue_Module/example_data/organ_segmentation_sample"
          curl -L --retry 4 --fail "$base/pipeline_test/CD68_chow_7790_fused_whole_arivis_exportC01xy10z10_0000.nii.gz" -o /tmp/raw/af.nii.gz
          curl -L --retry 4 --fail "$base/pipeline_test/CD68_chow_7790_fused_whole_arivis_exportC01xy10z10_0001.nii.gz" -o /tmp/raw/pi.nii.gz
          curl -L --retry 4 --fail "$base/segmentation/CD68_chow_7790.nii.gz" -o /tmp/raw/organs.nii.gz
          rm -f /tmp/Tissue_model.zip

      - name: Upload model fold
        uses: actions/upload-artifact@v4
        with:
          name: tissue-model-fold0
          path: /tmp/model
          compression-level: 0

      - name: Upload same-mouse raw channels
        uses: actions/upload-artifact@v4
        with:
          name: same-mouse-raw
          path: /tmp/raw
          compression-level: 0

  infer:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slab: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: tissue-model-fold0
          path: /tmp/model

      - name: Download same-mouse channels
        uses: actions/download-artifact@v4
        with:
          name: same-mouse-raw
          path: /tmp/raw

      - name: Install inference dependencies
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet nnunetv2 nibabel

      - name: Add MouseMapper trainer compatibility alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import nnunetv2.training.nnUNetTrainer as pkg
          p=Path(pkg.__file__).parent/'nnUNetTrainerv2.py'
          p.write_text("from nnunetv2.training.nnUNetTrainer.nnUNetTrainer import nnUNetTrainer\nclass nnUNetTrainerv2(nnUNetTrainer):\n    pass\n")
          PY

      - name: Build normalized slab
        shell: bash
        env:
          SLAB: ${{ matrix.slab }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/input /tmp/output /tmp/result
          python - <<'PY'
          import json, os
          import nibabel as nib
          import numpy as np
          slab=int(os.environ['SLAB'])
          af=np.asanyarray(nib.load('/tmp/raw/af.nii.gz').dataobj).astype(np.float32)/255.0
          pi=np.asanyarray(nib.load('/tmp/raw/pi.nii.gz').dataobj).astype(np.float32)/255.0
          shape=np.array(af.shape,dtype=int)
          edges=np.rint(np.linspace(0,shape[1],7)).astype(int)
          core0,core1=int(edges[slab]),int(edges[slab+1])
          context=64
          y0=max(0,core0-context); y1=min(int(shape[1]),core1+context)
          sl=(slice(None),slice(y0,y1),slice(None))
          aff=np.eye(4)
          nib.save(nib.Nifti1Image(af[sl].astype(np.float32),aff),'/tmp/input/case_0000.nii.gz')
          nib.save(nib.Nifti1Image(pi[sl].astype(np.float32),aff),'/tmp/input/case_0001.nii.gz')
          meta={'slab':slab,'full_shape':shape.tolist(),'core':[core0,core1],'input_y':[y0,y1],'crop_core':[core0-y0,core1-y0]}
          open('/tmp/result/meta.json','w').write(json.dumps(meta,indent=2))
          print('SLAB_META='+json.dumps(meta,sort_keys=True))
          PY

      - name: Run official Tissue Module fold 0
        shell: bash
        env:
          nnUNet_results: /tmp/model
          nnUNet_raw: /tmp/nnUNet_raw
          nnUNet_preprocessed: /tmp/nnUNet_preprocessed
        run: |
          /usr/bin/time -v nnUNetv2_predict \
            -i /tmp/input \
            -o /tmp/output \
            -d 310 \
            -c 3d_fullres \
            -tr nnUNetTrainer \
            -f 0 \
            -chk checkpoint_final.pth \
            -device cpu \
            --disable_tta \
            -step_size 0.75

      - name: Keep only non-overlap core
        shell: bash
        run: |
          python - <<'PY'
          import json, nibabel as nib, numpy as np
          meta=json.load(open('/tmp/result/meta.json'))
          pred=np.asanyarray(nib.load('/tmp/output/case.nii.gz').dataobj).astype(np.uint8)
          a,b=meta['crop_core']
          core=pred[:,a:b,:]
          nib.save(nib.Nifti1Image(core,np.eye(4)),'/tmp/result/core.nii.gz')
          vals,counts=np.unique(core,return_counts=True)
          meta['labels']={str(int(v)):int(c) for v,c in zip(vals,counts)}
          open('/tmp/result/meta.json','w').write(json.dumps(meta,indent=2,sort_keys=True))
          print('SLAB_LABELS='+json.dumps(meta['labels'],sort_keys=True))
          PY

      - name: Upload slab
        uses: actions/upload-artifact@v4
        with:
          name: tissue-slab-${{ matrix.slab }}
          path: /tmp/result
          compression-level: 0

  merge:
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout viewer
        uses: actions/checkout@v4

      - name: Download slabs
        uses: actions/download-artifact@v4
        with:
          pattern: tissue-slab-*
          path: /tmp/slabs

      - name: Merge same-mouse tissue map
        shell: bash
        run: |
          python -m pip install --quiet nibabel numpy matplotlib
          python - <<'PY'
          import glob, json, os
          import nibabel as nib
          import numpy as np
          import matplotlib.pyplot as plt

          items=[]
          for meta_path in glob.glob('/tmp/slabs/tissue-slab-*/meta.json'):
              meta=json.load(open(meta_path))
              core_path=os.path.join(os.path.dirname(meta_path),'core.nii.gz')
              items.append((meta,core_path))
          items.sort(key=lambda x:x[0]['slab'])
          if len(items)!=6: raise RuntimeError(f'Expected 6 slabs, found {len(items)}')

          shape=tuple(items[0][0]['full_shape'])
          full=np.zeros(shape,dtype=np.uint8)
          for meta,path in items:
              core=np.asanyarray(nib.load(path).dataobj).astype(np.uint8)
              a,b=meta['core']
              if core.shape!=(shape[0],b-a,shape[2]):
                  raise RuntimeError(f"Slab {meta['slab']} shape mismatch: {core.shape}")
              full[:,a:b,:]=core

          vals,counts=np.unique(full,return_counts=True)
          labels={str(int(v)):int(c) for v,c in zip(vals,counts)}
          print('FULL_TISSUE_LABELS='+json.dumps(labels,sort_keys=True))
          if int(labels.get('3',0))<10000:
              raise RuntimeError('Bone label 3 is unexpectedly sparse; refusing to publish.')
          if int(labels.get('4',0))<1000:
              raise RuntimeError('Marrow label 4 is unexpectedly sparse; refusing to publish.')

          bm=np.zeros_like(full,dtype=np.uint8)
          bm[full==3]=3; bm[full==4]=4
          os.makedirs('docs/models',exist_ok=True)
          out='docs/models/CD68_chow_7790_bone_marrow_tissue_fold0.nii.gz'
          nib.save(nib.Nifti1Image(bm,np.eye(4)),out)

          bone=(full==3); marrow=(full==4)
          fig,axes=plt.subplots(1,3,figsize=(15,5))
          for ax,axis,title in zip(axes,[0,1,2],['sagittal-like','long-axis','axial-like']):
              proj=bone.max(axis=axis).astype(float)+0.5*marrow.max(axis=axis).astype(float)
              ax.imshow(proj.T,origin='lower',cmap='gray');ax.set_title(title);ax.axis('off')
          plt.tight_layout();plt.savefig('/tmp/tissue_bone_preview.png',dpi=180);plt.close()
          report={'shape':list(shape),'labels':labels,'bone_voxels':int(bone.sum()),'marrow_voxels':int(marrow.sum()),'model':'MouseMapper Dataset310_AllSeg fold_0','source_mouse':'CD68_chow_7790','input':'public xy10z10 PI/AF channels normalized to 0..1'}
          open('/tmp/tissue_report.json','w').write(json.dumps(report,indent=2,sort_keys=True))
          print('REPORT='+json.dumps(report,sort_keys=True))
          PY
          ls -lh docs/models/CD68_chow_7790_bone_marrow_tissue_fold0.nii.gz /tmp/tissue_bone_preview.png

      - name: Commit tissue map
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/models/CD68_chow_7790_bone_marrow_tissue_fold0.nii.gz
          git commit -m "Add same-mouse MouseMapper bone and marrow tissue map"
          git push

      - name: Upload full-map QA
        uses: actions/upload-artifact@v4
        with:
          name: mousemapper-full-tissue-map-qa
          path: |
            /tmp/tissue_report.json
            /tmp/tissue_bone_preview.png
            docs/models/CD68_chow_7790_bone_marrow_tissue_fold0.nii.gz
