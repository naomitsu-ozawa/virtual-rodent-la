name: MouseMapper model inspect

on:
  push:
    paths:
      - '.github/workflows/mousemapper-model-inspect.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch Tissue model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/modelmeta
          url="https://media.githubusercontent.com/media/erturklab/mouseMapper/7fe04a9ccf37664d76fe548ae226147c0023ceb7/models/Tissue_model.zip"
          curl -L --retry 4 --fail "$url" -o /tmp/Tissue_model.zip
          ls -lh /tmp/Tissue_model.zip
          unzip -l /tmp/Tissue_model.zip | tail -n 40
          python - <<'PY'
          import zipfile, os
          z=zipfile.ZipFile('/tmp/Tissue_model.zip')
          names=z.namelist()
          wanted=[n for n in names if n.endswith('dataset.json') or n.endswith('plans.json')]
          print('META_FILES=',wanted)
          for n in wanted:
              print('\n===== '+n+' =====')
              data=z.read(n).decode('utf-8','replace')
              print(data[:30000])
              out='/tmp/modelmeta/'+n.replace('/','__')
              open(out,'w').write(data)
          PY

      - name: Upload model metadata
        uses: actions/upload-artifact@v4
        with:
          name: mousemapper-model-metadata
          path: /tmp/modelmeta
