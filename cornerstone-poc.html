<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d0f" />
  <title>Virtual Rodent Lab — Cornerstone MPR PoC</title>
  <link rel="stylesheet" href="/cornerstone-poc.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Virtual Rodent Lab</h1>
        <p>Cornerstone3D MPR PoC · full-resolution · no resampling</p>
      </div>
      <a href="/">現行版へ戻る</a>
    </header>

    <section class="controls">
      <label class="button">
        DICOMフォルダ
        <input id="folder-input" type="file" webkitdirectory multiple hidden />
      </label>
      <label class="button secondary">
        DICOMファイル
        <input id="file-input" type="file" multiple hidden />
      </label>
      <button id="clear-button" class="button secondary" type="button">クリア</button>
      <span id="status">初期化中…</span>
    </section>

    <section class="metrics">
      <span>Files <strong id="metric-files">0</strong></span>
      <span>Source <strong id="metric-source">0 B</strong></span>
      <span>Headers <strong id="metric-headers">—</strong></span>
      <span>Volume <strong id="metric-volume">—</strong></span>
      <span>Cache <strong id="metric-cache">0 B</strong></span>
    </section>

    <section class="grid">
      <article class="viewport-card">
        <div class="label">Axial</div>
        <div id="axial" class="viewport"></div>
      </article>
      <article class="viewport-card">
        <div class="label">Coronal</div>
        <div id="coronal" class="viewport"></div>
      </article>
      <article class="viewport-card">
        <div class="label">Sagittal</div>
        <div id="sagittal" class="viewport"></div>
      </article>
    </section>

    <section class="notes">
      <strong>検証項目</strong>
      <span>元解像度維持 / Cornerstone worker decode / progressive volume / MPR操作 / iPad Safariメモリ</span>
    </section>
  </main>
  <script type="module" src="/src/cornerstone-poc.js"></script>
</body>
</html>
